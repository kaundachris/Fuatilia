{% extends "base.html" %}

{% block header %}
<div class="header">
    <h1>Fuatilia</h1>
    
    <div class="nav">
        <form action="/" method="get">
            <input name="search" hidden>
            <input type="submit" name="submit" value="Search">
        </form>

        <form action="/login" method="get">
            <input name="login" hidden>
            <input type="submit" name="submit" value="Log In">
        </form>
    </div>
</div>
{% endblock %}

{% block main %}
    <h1>Register Below</h1>
    <i class="more_info">Do not use a password you use anywhere else!</i>

    <form action="/register" method="post">
        <div>
            <input type="email" name="username" autofocus autocomplete="off" placeholder="Enter your email">
        </div>
        <div>
            <input type="password" name="password" autocomplete="off"
                placeholder="Password (6-character minimum; at least one number, one letter, and one special character)">
        </div>
        <div>
            <input type="password" name="confirm_password" autocomplete="off"
                placeholder="Confirm Password (Must match with the password entered above)">
        </div>
        <div>
            <input type="submit" name="submit" value="Register">
        </div>
    </form>

    <p> {{ message }}</p>
{% endblock %}
