{% extends "base.html" %}

{% block header %}
<div class="header">
    <h1>Fuatilia</h1>
    
    <div class="nav">
        <form action="/" method="get">
            <input name="search" hidden>
            <input type="submit" name="submit" value="Search">
        </form>

        <form action="/logout" method="get">
            <input name="logout" hidden>
            <input type="submit" name="submit"  value="Log Out">
        </form>
    </div>
</div>
{% endblock %}

{% block main %}
    <h1>Change Password Below</h1>
    <i class="more_info">Do not use a password you use anywhere else!</i>

    <form action="/change" method="post">
        <div>
            <input type="password" name="current_password" autofocus autocomplete="off"
                placeholder="Current Password (6-character minimum; at least one number, one letter, and one special character)" {% if disabled %} disabled {% endif %}>
        </div>

        <div>
            <input type="password" name="new_password" autocomplete="off"
                placeholder="New Password (6-character minimum; at least one number, one letter, and one special character)" {% if disabled %} disabled {% endif %}>
        </div>

        <div>
            <input type="password" name="confirm_password" autocomplete="off"
                placeholder="Confirm Password (Must match with the password entered above)" {% if disabled %} disabled {% endif %}>
        </div>

        <div>
            <input type="submit" name="submit" value="Change Password">
        </div>
    </form>

    <p> {{ message }}</p>
{% endblock %}
