{% extends "base.html" %}

{% block header %}
<div class="header">
    <h1>Fuatilia</h1>

    <div class="nav">
        <form action="/" method="get">
            <input name="search" hidden>
            <input type="submit" name="submit" value="Search">
        </form>

        <form action="/register" method="get">
            <input name="register" hidden>
            <input type="submit" name="submit" value="Register">
        </form>
    </div>
</div>
{% endblock %}

{% block main %}
    <h1>Log In</h1>
    <i class="more_info">Logging in allows you to keep a record of your searches for future reference</i>

    <form action="/login" method="post">
        <div>
            <input type="email" name="username" autofocus autocomplete="off"
                placeholder="Enter your email" {% if disabled %} disabled {% endif %}>
        </div>
        <div>
            <input type="password" name="password" autocomplete="off"
                placeholder="Password (6-character minimum; at least one number, one letter, and one special character)" {% if disabled %} disabled {% endif %}>
        </div>

        <div>
            <input type="submit" name="submit" value="Log In">
        </div>
    </form>

    <p> {{ message }}</p>
{% endblock %}
